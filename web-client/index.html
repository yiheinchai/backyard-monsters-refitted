<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backyard Monsters Refitted</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #1a1a2e;
      }
      
      #game-container {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        color: white;
        font-family: Arial, sans-serif;
      }
      
      #loading-screen.hidden {
        display: none;
      }
      
      .loading-title {
        font-size: 32px;
        margin-bottom: 20px;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
      }
      
      .loading-bar-container {
        width: 300px;
        height: 20px;
        background: #0f0f23;
        border-radius: 10px;
        overflow: hidden;
        border: 2px solid #4a90a4;
      }
      
      .loading-bar {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #4a90a4, #6dd5ed);
        transition: width 0.3s ease;
      }
      
      .loading-text {
        margin-top: 15px;
        font-size: 14px;
        color: #8b8b9e;
      }
      
      /* Login Screen */
      #login-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 999;
        color: white;
        font-family: Arial, sans-serif;
      }
      
      #login-screen.visible {
        display: flex;
      }
      
      .login-container {
        background: rgba(30, 30, 60, 0.9);
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        min-width: 350px;
      }
      
      .login-title {
        font-size: 24px;
        margin-bottom: 30px;
        text-align: center;
        color: #6dd5ed;
      }
      
      .form-group {
        margin-bottom: 20px;
      }
      
      .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #a0a0c0;
      }
      
      .form-group input {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 5px;
        background: #0f0f23;
        color: white;
        font-size: 14px;
      }
      
      .form-group input:focus {
        outline: 2px solid #4a90a4;
      }
      
      .btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
        transition: background 0.3s ease;
      }
      
      .btn-primary {
        background: linear-gradient(90deg, #4a90a4, #6dd5ed);
        color: white;
        margin-bottom: 10px;
      }
      
      .btn-primary:hover {
        background: linear-gradient(90deg, #3a80a4, #5dc5dd);
      }
      
      .btn-secondary {
        background: #2a2a4a;
        color: #a0a0c0;
      }
      
      .btn-secondary:hover {
        background: #3a3a5a;
      }
      
      .error-message {
        color: #ff6b6b;
        margin-bottom: 15px;
        text-align: center;
        display: none;
      }
      
      .error-message.visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <h1 class="loading-title">Backyard Monsters Refitted</h1>
      <div class="loading-bar-container">
        <div class="loading-bar" id="loading-bar"></div>
      </div>
      <p class="loading-text" id="loading-text">Initializing...</p>
    </div>
    
    <div id="login-screen">
      <div class="login-container">
        <h2 class="login-title">🏠 Backyard Monsters</h2>
        <div class="error-message" id="error-message"></div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter your email" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" />
        </div>
        <button class="btn btn-primary" id="login-btn">Login</button>
        <button class="btn btn-secondary" id="register-btn">Create Account</button>
      </div>
    </div>
    
    <div id="game-container"></div>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
