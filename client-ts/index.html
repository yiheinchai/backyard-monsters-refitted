<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backyard Monsters</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #1D232A;
      }
      
      #game-container {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      
      #game-canvas {
        background-color: #1D232A;
      }
      
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #1D232A;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        color: white;
        font-family: Arial, sans-serif;
      }
      
      #loading-screen.hidden {
        display: none;
      }
      
      .loading-text {
        font-size: 24px;
        margin-bottom: 20px;
      }
      
      .loading-bar-container {
        width: 300px;
        height: 20px;
        background-color: #333;
        border-radius: 10px;
        overflow: hidden;
      }
      
      .loading-bar {
        width: 0%;
        height: 100%;
        background-color: #4CAF50;
        transition: width 0.3s ease;
      }
      
      /* Auth Form Styles */
      #auth-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(29, 35, 42, 0.95);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 2000;
      }
      
      #auth-container.hidden {
        display: none;
      }
      
      .auth-form {
        background-color: #2a3642;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        width: 350px;
        color: white;
        font-family: Arial, sans-serif;
      }
      
      .auth-form h2 {
        text-align: center;
        margin-bottom: 30px;
        color: #4CAF50;
      }
      
      .auth-form input {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border: none;
        border-radius: 5px;
        background-color: #1D232A;
        color: white;
        font-size: 14px;
      }
      
      .auth-form input::placeholder {
        color: #888;
      }
      
      .auth-form button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 5px;
        background-color: #4CAF50;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s;
      }
      
      .auth-form button:hover {
        background-color: #45a049;
      }
      
      .auth-toggle {
        text-align: center;
        margin-top: 20px;
        color: #888;
      }
      
      .auth-toggle a {
        color: #4CAF50;
        cursor: pointer;
        text-decoration: underline;
      }
      
      .auth-error {
        color: #ff5252;
        text-align: center;
        margin-bottom: 15px;
        display: none;
      }
      
      .auth-error.visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div class="loading-text">Loading Backyard Monsters...</div>
      <div class="loading-bar-container">
        <div class="loading-bar" id="loading-bar"></div>
      </div>
    </div>
    
    <div id="auth-container" class="hidden">
      <div class="auth-form" id="login-form">
        <h2>Backyard Monsters</h2>
        <div class="auth-error" id="login-error"></div>
        <input type="text" id="login-username" placeholder="Username" />
        <input type="password" id="login-password" placeholder="Password" />
        <button id="login-btn">Login</button>
        <div class="auth-toggle">
          Don't have an account? <a id="show-register">Register</a>
        </div>
      </div>
      
      <div class="auth-form hidden" id="register-form">
        <h2>Create Account</h2>
        <div class="auth-error" id="register-error"></div>
        <input type="text" id="register-username" placeholder="Username" />
        <input type="email" id="register-email" placeholder="Email" />
        <input type="password" id="register-password" placeholder="Password" />
        <input type="password" id="register-confirm" placeholder="Confirm Password" />
        <button id="register-btn">Register</button>
        <div class="auth-toggle">
          Already have an account? <a id="show-login">Login</a>
        </div>
      </div>
    </div>
    
    <div id="game-container">
      <canvas id="game-canvas"></canvas>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
