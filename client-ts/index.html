<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backyard Monsters Refitted</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #1D232A;
        font-family: Arial, sans-serif;
      }
      #game-container {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        color: white;
      }
      #loading-screen.hidden {
        display: none;
      }
      .loading-title {
        font-size: 48px;
        font-weight: bold;
        margin-bottom: 20px;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        color: #ff6b35;
      }
      .loading-subtitle {
        font-size: 18px;
        margin-bottom: 40px;
        color: #ccc;
      }
      .loading-bar-container {
        width: 400px;
        height: 30px;
        background: rgba(255,255,255,0.1);
        border-radius: 15px;
        overflow: hidden;
        border: 2px solid rgba(255,107,53,0.5);
      }
      .loading-bar {
        height: 100%;
        background: linear-gradient(90deg, #ff6b35, #f7c331);
        width: 0%;
        transition: width 0.3s ease;
        border-radius: 15px;
      }
      .loading-status {
        margin-top: 20px;
        font-size: 14px;
        color: #aaa;
      }
      /* Login form styles */
      #login-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 999;
        color: white;
      }
      #login-screen.visible {
        display: flex;
      }
      .login-container {
        background: rgba(0,0,0,0.5);
        padding: 40px;
        border-radius: 15px;
        border: 2px solid rgba(255,107,53,0.3);
        min-width: 400px;
      }
      .login-title {
        font-size: 32px;
        font-weight: bold;
        margin-bottom: 30px;
        text-align: center;
        color: #ff6b35;
      }
      .form-group {
        margin-bottom: 20px;
      }
      .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #ccc;
      }
      .form-group input {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid rgba(255,107,53,0.3);
        border-radius: 8px;
        background: rgba(255,255,255,0.1);
        color: white;
        font-size: 16px;
        outline: none;
        transition: border-color 0.3s;
      }
      .form-group input:focus {
        border-color: #ff6b35;
      }
      .btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s;
        margin-bottom: 10px;
      }
      .btn-primary {
        background: linear-gradient(90deg, #ff6b35, #f7c331);
        color: #1a1a2e;
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(255,107,53,0.4);
      }
      .btn-secondary {
        background: transparent;
        border: 2px solid #ff6b35;
        color: #ff6b35;
      }
      .btn-secondary:hover {
        background: rgba(255,107,53,0.1);
      }
      .error-message {
        color: #ff4444;
        text-align: center;
        margin-top: 15px;
        font-size: 14px;
      }
      .toggle-form {
        text-align: center;
        margin-top: 20px;
        color: #aaa;
      }
      .toggle-form a {
        color: #ff6b35;
        cursor: pointer;
        text-decoration: none;
      }
      .toggle-form a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div class="loading-title">Backyard Monsters</div>
      <div class="loading-subtitle">Refitted - TypeScript Edition</div>
      <div class="loading-bar-container">
        <div class="loading-bar" id="loading-bar"></div>
      </div>
      <div class="loading-status" id="loading-status">Initializing...</div>
    </div>
    
    <div id="login-screen">
      <div class="login-container">
        <div class="login-title">Welcome Back!</div>
        <form id="login-form">
          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" name="email" required placeholder="Enter your email">
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" name="password" required placeholder="Enter your password">
          </div>
          <button type="submit" class="btn btn-primary">Login</button>
          <div class="error-message" id="login-error"></div>
          <div class="toggle-form">
            Don't have an account? <a id="show-register">Register</a>
          </div>
        </form>
        
        <form id="register-form" style="display: none;">
          <div class="form-group">
            <label for="register-username">Username</label>
            <input type="text" id="register-username" name="username" required placeholder="Choose a username">
          </div>
          <div class="form-group">
            <label for="register-email">Email</label>
            <input type="email" id="register-email" name="email" required placeholder="Enter your email">
          </div>
          <div class="form-group">
            <label for="register-password">Password</label>
            <input type="password" id="register-password" name="password" required placeholder="Choose a password">
          </div>
          <button type="submit" class="btn btn-primary">Register</button>
          <div class="error-message" id="register-error"></div>
          <div class="toggle-form">
            Already have an account? <a id="show-login">Login</a>
          </div>
        </form>
      </div>
    </div>
    
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
